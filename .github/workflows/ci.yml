name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall reconciliation local-relay root-cause root-cause-sync transport-envelope transport-spool windows-agent bigcircle-control filesystem-exchange runtime-acceptance remote-transport cloudflare-remote-gateway/deploy
      - run: python reconciliation/tests/test_reconciliation.py
      - run: python reconciliation/tests/test_pipeline.py
      - run: python local-relay/tests/test_relay.py
      - shell: pwsh
        run: '[void][scriptblock]::Create((Get-Content periodic-alignment/run-once.ps1 -Raw))'
      - run: node --check browser-bridge/service-worker.js
      - run: node --check browser-bridge/root-cause-writer.js
      - run: node --check browser-bridge/popup.js
      - run: python browser-bridge/tests/static_test.py
      - run: python periodic-alignment/tests/static_test.py
      - run: python root-cause/tests/test_extract.py
      - run: python root-cause-sync/tests/test_plan.py
      - run: python transport-envelope/tests/test_envelope.py
      - run: python transport-spool/tests/test_spool.py
      - run: python windows-agent/tests/test_materialize_case_feed.py
      - run: python windows-agent/tests/test_run_once.py
      - run: python bigcircle-control/tests/test_consume_result.py
      - run: python filesystem-exchange/tests/test_exchange.py
      - run: python remote-transport/tests/test_client.py
      - run: node --check cloudflare-remote-gateway/src/index.mjs
      - run: node cloudflare-remote-gateway/tests/test_gateway.mjs
      - run: python cloudflare-remote-gateway/deploy/tests/test_bundle.py
      - run: python scripts/repo_guard.py .

  windows-relay:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python local-relay/tests/test_relay.py
      - run: python transport-spool/tests/test_spool.py
      - run: python windows-agent/tests/test_materialize_case_feed.py
      - run: python windows-agent/tests/test_run_once.py
      - run: python bigcircle-control/tests/test_consume_result.py
      - run: python filesystem-exchange/tests/test_exchange.py
      - run: python remote-transport/tests/test_client.py
      - run: node --check cloudflare-remote-gateway/src/index.mjs
      - run: node cloudflare-remote-gateway/tests/test_gateway.mjs
      - run: python cloudflare-remote-gateway/deploy/tests/test_bundle.py
      - run: python runtime-acceptance/gate_d2_windows_acceptance.py
      - shell: powershell
        run: '[void][scriptblock]::Create((Get-Content periodic-alignment/run-once.ps1 -Raw))'
      - shell: powershell
        run: |
          [void][scriptblock]::Create((Get-Content release/root-cause-write-runtime/upgrade-from-v0.2.2.ps1 -Raw))
          ./scripts/build-root-cause-write-runtime.ps1
          foreach ($zip in @(
            "dist-root-cause-write/ones-browser-bridge-v0.5.0.zip",
            "dist-root-cause-write/ones-local-relay-v0.3.0.zip"
          )) {
            if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw ("PACKAGE_MISSING: " + $zip) }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ones-root-cause-write-runtime-v0.5.0-v0.3.0
          path: |
            dist-root-cause-write/ones-browser-bridge-v0.5.0.zip
            dist-root-cause-write/ones-browser-bridge-v0.5.0.zip.sha256
            dist-root-cause-write/ones-local-relay-v0.3.0.zip
            dist-root-cause-write/ones-local-relay-v0.3.0.zip.sha256
          if-no-files-found: error
      - shell: powershell
        run: |
          [void][scriptblock]::Create((Get-Content release/root-cause-planner-runtime-v0.1.0/run-planner.ps1 -Raw))
          ./scripts/build-root-cause-planner-runtime.ps1
          if (-not (Test-Path "dist-root-cause-planner/ones-root-cause-planner-runtime-v0.1.0.zip")) { throw "PLANNER_PACKAGE_MISSING" }
      - uses: actions/upload-artifact@v4
        with:
          name: ones-root-cause-planner-runtime-v0.1.0
          path: |
            dist-root-cause-planner/ones-root-cause-planner-runtime-v0.1.0.zip
            dist-root-cause-planner/ones-root-cause-planner-runtime-v0.1.0.zip.sha256
          if-no-files-found: error
      - shell: powershell
        run: |
          [void][scriptblock]::Create((Get-Content release/root-cause-planner-runtime-v0.2.0/run-planner.ps1 -Raw))
          ./scripts/build-root-cause-planner-runtime-v020.ps1
          if (-not (Test-Path "dist-root-cause-planner-v020/ones-root-cause-planner-runtime-v0.2.0.zip")) { throw "PLANNER_V020_PACKAGE_MISSING" }
      - uses: actions/upload-artifact@v4
        with:
          name: ones-root-cause-planner-runtime-v0.2.0
          path: |
            dist-root-cause-planner-v020/ones-root-cause-planner-runtime-v0.2.0.zip
            dist-root-cause-planner-v020/ones-root-cause-planner-runtime-v0.2.0.zip.sha256
          if-no-files-found: error
      - shell: powershell
        run: |
          [void][scriptblock]::Create((Get-Content release/windows-agent-v0.1.1/setup.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content release/windows-agent-v0.1.1/run-once.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content release/windows-agent-v0.1.1/show-status.ps1 -Raw))
          ./scripts/build-windows-local-agent-package.ps1
          $zip = Get-ChildItem dist/ones-bigcircle-windows-agent-v0.1.1.zip
          if (-not $zip) { throw "PACKAGE_ZIP_MISSING" }
          $archive = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try { $entries = @($archive.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }) } finally { $archive.Dispose() }
          $entries | ForEach-Object { Write-Host ("ZIP_ENTRY=" + $_) }
          foreach ($required in @(
            "ones-bigcircle-windows-agent-v0.1.1/periodic-alignment/run-once.ps1",
            "ones-bigcircle-windows-agent-v0.1.1/run-once.ps1",
            "ones-bigcircle-windows-agent-v0.1.1/config.example.ps1",
            "ones-bigcircle-windows-agent-v0.1.1/BUILD.json"
          )) {
            if ($entries -notcontains $required) { throw ("PACKAGE_ENTRY_MISSING: " + $required) }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ones-bigcircle-windows-agent-v0.1.1
          path: |
            dist/ones-bigcircle-windows-agent-v0.1.1.zip
            dist/ones-bigcircle-windows-agent-v0.1.1.zip.sha256
          if-no-files-found: error
